[project]
name = "ringdown"
version = "0.1.0"
description = "Ingest logs, decide what matters, ring the right responder — human or agent."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",     # WebUI private_key_jwt + encrypted refresh-token store
    "httpx>=0.27",
    "google-re2>=1.1.20251105", # linear-time regexes on the per-line ingress hot path
    "psycopg[binary,pool]>=3.2",
    "mcp>=1.2,<2",           # FastMCP v1 control plane (v2 renamed this API)
    "pyjwt[crypto]>=2.8",   # Entra bearer validation (JWKS/RS256)
    "starlette>=0.41",      # admin WebUI
    "uvicorn>=0.30",        # ASGI host for the MCP
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ringdown*"]

[tool.setuptools.package-data]
ringdown = ["static/*", "*.sql"]
